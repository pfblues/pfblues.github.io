<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bald verfügbar</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #1f2937, #374151);
      color: #f9fafb;
      text-align: center;
      padding: 24px;
    }

    main {
      max-width: 640px;
    }

    .icon {
      font-size: 3.5rem;
      margin-bottom: 24px;
    }

    h1 {
      font-size: clamp(1.8rem, 5vw, 3rem);
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 16px;
    }

    p {
      font-size: 1.1rem;
      color: #d1d5db;
    }
  </style>
</head>
<body>
  <main>
    <div class="icon">🚧</div>
    <h1>Hier entsteht in Kürze eine neue Webseite</h1>
    <p>Schauen Sie bald wieder vorbei.</p>
  </main>
</body>
</html>
